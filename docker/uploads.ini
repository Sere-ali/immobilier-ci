; Immobilier CI — limites d'upload relevées pour les photos et vidéos d'annonces
; (les valeurs par défaut de PHP, 2M/8M, sont trop basses pour des photos de smartphone)
; upload_max_filesize : plus gros fichier unique (une vidéo d'annonce : 50 Mo max côté application)
; post_max_size : total d'une soumission du formulaire (jusqu'à 20 photos + 1 vidéo)
upload_max_filesize = 50M
post_max_size = 120M
max_file_uploads = 21
max_execution_time = 180
