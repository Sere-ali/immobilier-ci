# Autorise les fichiers .htaccess à l'intérieur de /var/www/html
# (nécessaire pour les URLs propres sans extension .php, voir .htaccess à la racine)
<Directory /var/www/html>
    AllowOverride All
    Options -Indexes -ExecCGI
</Directory>

# Ne pas révéler la version d'Apache / du système (pages d'erreur, en-têtes)
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Aucun accès web direct au code interne, aux données de démo et aux fichiers de déploiement
<DirectoryMatch "^/var/www/html/(config|includes|docker|\.github|superadmin/data)(/|$)">
    Require all denied
</DirectoryMatch>

# Fichiers de configuration / déploiement / base de données jamais téléchargeables
<FilesMatch "(?i)(\.(sql|md|yml|yaml|ini|conf|sh|lock|log|env|bak|dist|inc)|Dockerfile|mysql\.Dockerfile|\.dockerignore|\.gitignore|composer\.(json|lock))$">
    Require all denied
</FilesMatch>

# Dossier d'envoi : jamais d'exécution de code, aucun script servi
<Directory /var/www/html/uploads>
    Options -Indexes -ExecCGI
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|pl|py|cgi|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
