<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#22304F"/><stop offset="1" stop-color="#0F1830"/>
</linearGradient>
</defs>
<style>
@keyframes sunPulse{0%,100%{opacity:.8}50%{opacity:.45}}
@keyframes winTwinkle{0%,100%{opacity:1}50%{opacity:.25}}
.sun{animation:sunPulse 4s ease-in-out infinite}
.win{animation:winTwinkle 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.sun,.win{animation:none}}
</style>
<rect width="800" height="600" fill="url(#bg)"/>
<circle class="sun" cx="180" cy="100" r="36" fill="#F0C54A" opacity=".8"/>
<line x1="0" y1="480" x2="800" y2="480" stroke="#D4A017" stroke-width="2" opacity=".5"/>
<g stroke="#F0C54A" stroke-width="2" fill="none" opacity=".4">
<rect x="230" y="330" width="90" height="150"/>
<line x1="230" y1="360" x2="320" y2="360"/><line x1="230" y1="390" x2="320" y2="390"/>
<line x1="230" y1="420" x2="320" y2="420"/><line x1="230" y1="450" x2="320" y2="450"/>
</g>
<rect x="340" y="110" width="150" height="370" rx="2" fill="none" stroke="#F0C54A" stroke-width="3"/>
<g stroke="#F0C54A" stroke-width="1.2" opacity=".85">
<line x1="340" y1="150" x2="490" y2="150"/><line x1="340" y1="190" x2="490" y2="190"/>
<line x1="340" y1="230" x2="490" y2="230"/><line x1="340" y1="270" x2="490" y2="270"/>
<line x1="340" y1="310" x2="490" y2="310"/><line x1="340" y1="350" x2="490" y2="350"/>
<line x1="340" y1="390" x2="490" y2="390"/><line x1="340" y1="430" x2="490" y2="430"/>
<line x1="415" y1="110" x2="415" y2="480"/>
</g>
<g fill="#F0C54A">
<rect class="win" style="animation-delay:.2s" x="352" y="160" width="20" height="20" opacity=".85"/>
<rect class="win" style="animation-delay:1.5s" x="458" y="160" width="20" height="20" opacity=".85"/>
<rect class="win" style="animation-delay:.8s" x="352" y="240" width="20" height="20" opacity=".85"/>
<rect class="win" style="animation-delay:2.1s" x="458" y="240" width="20" height="20" opacity=".85"/>
<rect class="win" style="animation-delay:1.9s" x="352" y="320" width="20" height="20" opacity=".85"/>
<rect class="win" style="animation-delay:.5s" x="458" y="320" width="20" height="20" opacity=".85"/>
<rect class="win" style="animation-delay:1.1s" x="352" y="400" width="20" height="20" opacity=".85"/>
<rect class="win" style="animation-delay:2.4s" x="458" y="400" width="20" height="20" opacity=".85"/>
</g>
<rect x="380" y="70" width="55" height="40" rx="2" fill="none" stroke="#D4A017" stroke-width="2.4"/>
<circle cx="392" cy="85" r="4" fill="#D4A017"/>
<g stroke="#F0C54A" stroke-width="2" fill="none" opacity=".4">
<rect x="510" y="380" width="80" height="100"/>
<line x1="510" y1="405" x2="590" y2="405"/><line x1="510" y1="430" x2="590" y2="430"/><line x1="510" y1="455" x2="590" y2="455"/>
</g>
<text x="400" y="540" text-anchor="middle" font-family="Georgia, 'Fraunces', serif" font-size="28" letter-spacing="9" fill="#F0C54A" font-weight="600">IMMEUBLE</text>
</svg>
