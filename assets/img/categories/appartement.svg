<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#3A3320"/><stop offset="1" stop-color="#141109"/>
</linearGradient>
</defs>
<style>
@keyframes sunPulse{0%,100%{opacity:.8}50%{opacity:.45}}
@keyframes winTwinkle{0%,100%{opacity:1}50%{opacity:.25}}
.sun{animation:sunPulse 4s ease-in-out infinite}
.win{animation:winTwinkle 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.sun,.win{animation:none}}
</style>
<rect width="800" height="600" fill="url(#bg)"/>
<circle class="sun" cx="140" cy="110" r="40" fill="#F0C54A" opacity=".8"/>
<line x1="0" y1="470" x2="800" y2="470" stroke="#D4A017" stroke-width="2" opacity=".5"/>
<g stroke="#F0C54A" stroke-width="3" fill="none">
<rect x="290" y="200" width="220" height="270" rx="4"/>
</g>
<g stroke="#F0C54A" stroke-width="1.6" opacity=".85">
<line x1="290" y1="260" x2="510" y2="260"/>
<line x1="290" y1="320" x2="510" y2="320"/>
<line x1="290" y1="380" x2="510" y2="380"/>
<line x1="290" y1="430" x2="510" y2="430"/>
<line x1="400" y1="200" x2="400" y2="470"/>
</g>
<g fill="#F0C54A" opacity=".9">
<rect class="win" style="animation-delay:.1s" x="315" y="222" width="26" height="26"/><rect class="win" style="animation-delay:1.4s" x="360" y="222" width="26" height="26"/>
<rect class="win" style="animation-delay:.7s" x="415" y="222" width="26" height="26"/><rect class="win" style="animation-delay:2s" x="460" y="222" width="26" height="26"/>
<rect class="win" style="animation-delay:1.8s" x="315" y="282" width="26" height="26"/><rect class="win" style="animation-delay:.4s" x="360" y="282" width="26" height="26"/>
<rect class="win" style="animation-delay:2.3s" x="415" y="282" width="26" height="26"/><rect class="win" style="animation-delay:1.1s" x="460" y="282" width="26" height="26"/>
<rect class="win" style="animation-delay:.9s" x="315" y="342" width="26" height="26"/><rect class="win" style="animation-delay:2.5s" x="360" y="342" width="26" height="26"/>
<rect class="win" style="animation-delay:.2s" x="415" y="342" width="26" height="26"/><rect class="win" style="animation-delay:1.6s" x="460" y="342" width="26" height="26"/>
</g>
<g stroke="#D4A017" stroke-width="2" fill="none" opacity=".6">
<line x1="290" y1="245" x2="270" y2="245"/><line x1="290" y1="305" x2="270" y2="305"/><line x1="290" y1="365" x2="270" y2="365"/>
<line x1="510" y1="245" x2="530" y2="245"/><line x1="510" y1="305" x2="530" y2="305"/><line x1="510" y1="365" x2="530" y2="365"/>
</g>
<rect x="370" y="400" width="60" height="70" fill="#0F1830" stroke="#F0C54A" stroke-width="2.5"/>
<text x="400" y="540" text-anchor="middle" font-family="Georgia, 'Fraunces', serif" font-size="26" letter-spacing="8" fill="#F0C54A" font-weight="600">APPARTEMENT</text>
</svg>
