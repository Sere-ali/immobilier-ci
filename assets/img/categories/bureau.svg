<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2B2F4A"/><stop offset="1" stop-color="#0E1122"/>
</linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="6" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<style>
@keyframes sunPulse{0%,100%{opacity:.88}50%{opacity:.6}}
@keyframes beacon{0%,100%{opacity:1}50%{opacity:.5}}
.sun{animation:sunPulse 5s cubic-bezier(.45,0,.55,1) infinite;filter:url(#glow)}
.beacon{animation:beacon 1.8s ease-in-out infinite;filter:url(#glow)}
@media (prefers-reduced-motion: reduce){.sun,.beacon{animation:none}}
</style>
<rect width="800" height="600" fill="url(#bg)"/>
<circle class="sun" cx="150" cy="100" r="34" fill="#F0C54A" opacity=".88"/>
<line x1="0" y1="470" x2="800" y2="470" stroke="#D4A017" stroke-width="2" opacity=".5"/>
<rect x="320" y="140" width="180" height="330" rx="3" fill="none" stroke="#F0C54A" stroke-width="3"/>
<g stroke="#F0C54A" stroke-width="1.3" opacity=".85">
<line x1="345" y1="140" x2="345" y2="470"/><line x1="370" y1="140" x2="370" y2="470"/>
<line x1="395" y1="140" x2="395" y2="470"/><line x1="420" y1="140" x2="420" y2="470"/>
<line x1="445" y1="140" x2="445" y2="470"/><line x1="470" y1="140" x2="470" y2="470"/>
<line x1="320" y1="180" x2="500" y2="180"/><line x1="320" y1="230" x2="500" y2="230"/>
<line x1="320" y1="280" x2="500" y2="280"/><line x1="320" y1="330" x2="500" y2="330"/>
<line x1="320" y1="380" x2="500" y2="380"/><line x1="320" y1="430" x2="500" y2="430"/>
</g>
<path d="M300 470 L340 430 L480 430 L520 470 Z" fill="none" stroke="#D4A017" stroke-width="2.4" stroke-linejoin="round"/>
<rect x="390" y="440" width="20" height="30" fill="#0E1122" stroke="#F0C54A" stroke-width="2"/>
<line x1="410" y1="130" x2="410" y2="105" stroke="#F0C54A" stroke-width="2"/>
<circle class="beacon" cx="410" cy="98" r="6" fill="#F0C54A" stroke="#F0C54A" stroke-width="2"/>
<text x="400" y="540" text-anchor="middle" font-family="Georgia, 'Fraunces', serif" font-size="30" letter-spacing="10" fill="#F0C54A" font-weight="600">BUREAU</text>
</svg>
