<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#22304F"/><stop offset="1" stop-color="#0F1830"/>
</linearGradient>
</defs>
<style>
@keyframes sunPulse{0%,100%{opacity:.85}50%{opacity:.5}}
@keyframes winGlow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.4}}
.sun{animation:sunPulse 4s ease-in-out infinite}
.win{animation:winGlow 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.sun,.win{animation:none}}
</style>
<rect width="800" height="600" fill="url(#bg)"/>
<circle class="sun" cx="660" cy="120" r="46" fill="#F0C54A" opacity=".85"/>
<g stroke="#D4A017" stroke-width="2" opacity=".35">
<path d="M40 420 L120 340 L200 420" fill="none"/>
<path d="M600 460 L660 400 L720 460" fill="none"/>
</g>
<line x1="0" y1="460" x2="800" y2="460" stroke="#D4A017" stroke-width="2" opacity=".5"/>
<g stroke="#F0C54A" stroke-width="3" fill="none" stroke-linejoin="round">
<path d="M230 460 L230 360 L400 280 L570 360 L570 460 Z"/>
<path d="M300 460 L300 390 L360 390 L360 460"/>
<rect class="win" x="410" y="380" width="60" height="60" rx="2"/>
<line x1="440" y1="380" x2="440" y2="440"/>
<line x1="410" y1="410" x2="470" y2="410"/>
</g>
<g stroke="#F0C54A" stroke-width="2.5" fill="none" stroke-linecap="round">
<path d="M160 460 V370 C160 350 176 335 195 335 C214 335 230 350 230 370" />
<path d="M160 400 C130 405 110 430 108 460 M230 400 C255 405 272 430 274 460"/>
</g>
<g stroke="#D4A017" stroke-width="2" fill="none" opacity=".8">
<rect x="595" y="410" width="90" height="40" rx="6"/>
<circle cx="615" cy="452" r="8"/><circle cx="665" cy="452" r="8"/>
</g>
<text x="400" y="540" text-anchor="middle" font-family="Georgia, 'Fraunces', serif" font-size="30" letter-spacing="10" fill="#F0C54A" font-weight="600">VILLA</text>
</svg>
