      <rect x="62" y="64" width="20" height="22" opacity="0.4"/>
      <rect x="108" y="64" width="20" height="22"/>
      <rect x="16" y="100" width="20" height="22" opacity="0.4"/>
      <rect x="62" y="100" width="20" height="22"/>
