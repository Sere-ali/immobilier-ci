    <rect x="44" y="182" width="26" height="46" fill="#7A5230" rx="2"/>
    <circle cx="63" cy="206" r="2.2" fill="#E8DCC8"/>
    <rect x="18" y="160" width="18" height="18" fill="#0F3D3E" rx="2"/>
    <rect x="18" y="160" width="18" height="18" fill="none" stroke="#0A2C2C" stroke-width="2"/>
    <rect x="82" y="160" width="18" height="18" fill="#0F3D3E" rx="2"/>
    <rect x="82" y="160" width="18" height="18" fill="none" stroke="#0A2C2C" stroke-width="2"/>
