    <polygon points="10,120 70,78 130,120" fill="#C87F2A"/>
    <rect x="12" y="120" width="116" height="108" fill="#E8DCC8"/>
    <rect x="12" y="120" width="116" height="10" fill="#d8c9a8"/>
    <rect x="55" y="176" width="30" height="52" fill="#7A5230" rx="2"/>
