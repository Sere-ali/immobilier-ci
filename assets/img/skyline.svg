    <path d="M15 140 Q 55 118 68 82 Q 30 98 17 138 Z" fill="#2E6B4F"/>
    <path d="M15 140 Q -10 98 -8 68 Q 18 90 20 136 Z" fill="#3C8562"/>
    <path d="M15 140 Q 42 96 42 66 Q 16 90 13 136 Z" fill="#3C8562"/>
