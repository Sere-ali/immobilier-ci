<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hors ligne — Immobilier CI</title>
<link rel="icon" href="/assets/img/icons/favicon-32.png" sizes="32x32">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:#0B1220;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Manrope,sans-serif;
    padding:32px;text-align:center;
  }
  .wrap{max-width:380px}
  .mark{width:64px;height:64px;border-radius:18px;background:#0B1220;border:1px solid rgba(212,160,23,.4);display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
  h1{font-size:1.3rem;margin:0 0 10px}
  p{color:rgba(255,255,255,.7);line-height:1.6;font-size:.95rem;margin:0 0 24px}
  button{
    background:#D4A017;color:#0B1220;border:none;padding:12px 26px;border-radius:999px;
    font-weight:800;font-size:.9rem;cursor:pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">🏠</div>
    <h1>Pas de connexion internet</h1>
    <p>Vous êtes hors ligne pour le moment. Vérifiez votre connexion pour consulter les annonces d'Immobilier CI.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
